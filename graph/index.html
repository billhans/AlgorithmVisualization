<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>图论算法 · 可视化教学 — 毕老师算法可视化</title>
<link rel="stylesheet" href="graph.css">
</head>
<body>
<div class="topnav">
  <a class="back" href="../index.html">← 返回主页</a>
  <span class="project-name">毕老师 · 算法可视化</span>
</div>

<header class="page-header">
  <div class="title-row">
    <div>
      <div class="eyebrow">GRAPH ALGORITHMS</div>
      <h1>🕸️ 图论算法 · 可视化教学</h1>
      <p class="subtitle">逐步观察距离如何更新、边如何入选，以及节点如何按依赖关系排序。</p>
    </div>
    <div class="algorithm-tabs" role="tablist" aria-label="选择图算法">
      <button class="algorithm-tab active" data-algorithm="dijkstra" role="tab" aria-selected="true">最短路 <small>Dijkstra</small></button>
      <button class="algorithm-tab" data-algorithm="kruskal" role="tab" aria-selected="false">最小生成树 <small>Kruskal</small></button>
      <button class="algorithm-tab" data-algorithm="topo" role="tab" aria-selected="false">拓扑排序 <small>Kahn</small></button>
    </div>
  </div>
  <div class="formula-box" id="formulaBox"></div>
</header>

<div class="layout">
  <aside class="panel">
    <div class="panel-section">
      <h2>算法说明</h2>
      <p id="algorithmDescription" class="description"></p>
    </div>
    <div class="panel-section" id="sourceSection">
      <label for="sourceSelect">起点</label>
      <select id="sourceSelect" class="control-select"></select>
    </div>
    <div class="panel-section">
      <h2>播放控制</h2>
      <div class="controls">
        <button class="btn" id="btnPrev" title="上一步">⏮ 上一步</button>
        <button class="btn" id="btnNext" title="下一步">下一步 ⏭</button>
        <button class="btn primary" id="btnPlay">▶ 播放</button>
        <button class="btn" id="btnReset">🔁 重置</button>
      </div>
      <div class="speed-row">
        <label for="speed">速度</label>
        <input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="1">
        <span class="speed-val mono" id="speedVal">1.0×</span>
      </div>
    </div>
    <div class="panel-section">
      <h2>颜色图例</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel-section note-box" id="graphNote"></div>
  </aside>

  <main class="viz">
    <section class="viz-card graph-card">
      <div class="viz-card-head">
        <div>
          <h2 class="viz-card-title" id="graphTitle">加权无向图</h2>
          <p class="viz-card-subtitle" id="graphSubtitle"></p>
        </div>
        <span class="step-counter" id="stepCounter" aria-live="polite">准备中</span>
      </div>
      <div class="graph-scroll">
        <svg id="graphSvg" viewBox="0 0 760 410" role="img" aria-label="图算法逐步演示图"></svg>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="viz-card data-card">
      <div class="viz-card-head">
        <div>
          <h2 class="viz-card-title" id="dataTitle">距离表</h2>
          <p class="viz-card-subtitle" id="dataSubtitle"></p>
        </div>
      </div>
      <div id="dataView" class="data-view"></div>
    </section>

    <section class="explain" aria-live="polite">
      <div class="explain-title"><span>步骤说明</span><span class="step-counter" id="explainCounter">—</span></div>
      <div class="explain-body" id="explainBody">点击「下一步」开始演示，也可以播放完整过程。</div>
    </section>
  </main>
</div>

<div class="shortcuts">快捷键：<kbd>←</kbd> 上一步　<kbd>→</kbd> 下一步　<kbd>空格</kbd> 播放 / 暂停　<kbd>R</kbd> 重置</div>
<script src="graph.js"></script>
</body>
</html>
